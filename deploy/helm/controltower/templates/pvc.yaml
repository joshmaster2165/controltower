{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not (include "controltower.postgres" .)) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "controltower.fullname" . }}
  labels:
    {{- include "controltower.labels" . | nindent 4 }}
  annotations:
    # Uninstalling keeps the data (and the generated master key). Delete the claim yourself to remove it.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
