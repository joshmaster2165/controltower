name: laptops on real machines

# The Laptops rollout on real Windows and macOS machines: the install files run the way Intune and Jamf run them, then
# the real Claude Code and Codex, configured by nothing else, call Control Tower as the person who signed in.
# Manual, and weekly (the clients change often). Run by hand with target "showcase", the same machines roll out against
# the deployed showcase instead, and show up in its console (Laptops, Flights, Airspace) as they sign in and call.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where the tools are rolled out to'
        type: choice
        options: [local, showcase]
        default: local
  schedule:
    - cron: '0 6 * * 1'

jobs:
  real:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: its Visual Studio lets better-sqlite3 build where no prebuilt binary fits.
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        if: inputs.target != 'showcase'
        env:
          CT_TEST_LICENSE_KEYS: '1'
      - run: npm install -g @anthropic-ai/claude-code @openai/codex @github/copilot
      - run: npx tsx scripts/laptops/real-machine.mts
        env:
          RESULTS_DIR: ${{ runner.temp }}
          GITHUB_TOKEN: ${{ github.token }}
          CT_REMOTE_URL: ${{ inputs.target == 'showcase' && 'https://showcase-production-b625.up.railway.app' || '' }}
          CT_REMOTE_ADMIN_KEY: ${{ inputs.target == 'showcase' && secrets.SHOWCASE_ADMIN_KEY || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: laptops-real-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/laptops-real-results.json
            ${{ runner.temp }}/claude-desktop-*.png
            ${{ runner.temp }}/claude-desktop-*.txt
          if-no-files-found: ignore
