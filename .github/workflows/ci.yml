name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm docs:build
      - run: pnpm test
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          if-no-files-found: ignore

  # Postgres and several instances: the whole end-to-end suite on Postgres, two instances sharing Postgres
  # and Redis, and copying a SQLite install into Postgres.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: for db in e2e cluster copytest; do PGPASSWORD=ci psql -h localhost -U postgres -c "CREATE DATABASE $db"; done
      - run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:ci@localhost:5432/e2e
      - run: npx tsx scripts/cluster/cluster.mts
        env:
          PG_URL: postgres://postgres:ci@localhost:5432/cluster
          REDIS_URL: redis://localhost:6379
          RESULTS_DIR: ${{ runner.temp }}
      - run: npx tsx scripts/cluster/copy-test.mts
        env:
          PG_URL: postgres://postgres:ci@localhost:5432/copytest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-postgres
          path: test-results
          if-no-files-found: ignore

  image:
    needs: [test, postgres]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing: GitHub's OIDC token is the signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Start the image before publishing it: on SQLite, and on Postgres with Redis.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ct-smoke
          cache-from: type=gha
      - name: Smoke test the image
        run: |
          set -e
          ready() { for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$1/readyz" >/dev/null 2>&1 && return 0; sleep 1; done; docker logs "$2"; return 1; }
          docker run -d --name ct-sqlite -p 4101:4000 -e CT_ADMIN_KEY=smoke-admin-key-0123456789 ct-smoke
          ready 4101 ct-sqlite
          # The app's own files are read-only to the user it runs as.
          if docker exec -u node ct-sqlite sh -c 'touch /app/dist/x || touch /app/x' 2>/dev/null; then echo "/app is writable by node"; exit 1; fi
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_PASSWORD=smoke postgres:17-alpine
          docker run -d --name redis --network smoke redis:7-alpine
          until docker exec pg pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          for n in 1 2; do
            docker run -d --name ct-pg-$n --network smoke -p 410$((n+1)):4000 -e CT_ADMIN_KEY=smoke-admin-key-0123456789 -e CT_MASTER_KEY=$(head -c 32 /dev/zero | base64) \
              -e CT_DATABASE_URL=postgres://postgres:smoke@pg:5432/postgres -e CT_REDIS_URL=redis://redis:6379 ct-smoke
          done
          ready 4102 ct-pg-1 && ready 4103 ct-pg-2
          docker logs ct-pg-1 2>&1 | grep -q "sharing Postgres and Redis"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and full build provenance, attached to the image as attestations.
          sbom: true
          provenance: mode=max
      # Sign what was pushed, by digest, with this workflow's identity (Sigstore keyless: no key to leak or rotate),
      # and record GitHub's own build attestation. Then check the signature the way a user would.
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "ghcr.io/${{ github.repository }}@${DIGEST}" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "::notice::Signed ghcr.io/${{ github.repository }}@${DIGEST}"

  # Helm chart: lint, refuse settings that lose data, then install on a kind cluster the way people will —
  # one pod on SQLite, and two on Postgres and Redis — with the image this commit builds. Published on tags.
  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CHART: deploy/helm/controltower
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
      - name: Lint and render
        run: |
          set -e
          helm lint "$CHART"
          for f in "$CHART"/ci/*-values.yaml; do helm lint "$CHART" -f "$f"; helm template t "$CHART" -f "$f" > /dev/null; done
          helm template t "$CHART" | grep -q 'readOnlyRootFilesystem: true'
          # Settings that would lose data or never work stop the install with a reason.
          refuses() { if out=$(helm template t "$CHART" "${@:2}" 2>&1); then echo "expected a refusal: ${*:2}"; exit 1; fi; echo "$out" | grep -q "$1" || { echo "$out"; exit 1; }; }
          refuses 'needs Postgres and Redis' --set replicaCount=2
          refuses 'needs redis.url' --set replicaCount=2 --set database.url=postgres://x --set secrets.masterKey=k
          refuses 'set secrets.masterKey' --set database.url=postgres://x
          refuses 'metricsToken' --set serviceMonitor.enabled=true
      - name: Chart version matches the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version: $v$" "$CHART/Chart.yaml" && grep -q "^appVersion: \"$v\"$" "$CHART/Chart.yaml" || { echo "Chart.yaml must say version $v"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: ghcr.io/joshmaster2165/controltower:ci
          cache-from: type=gha
      - uses: helm/kind-action@v1.15.0
        with:
          cluster_name: ct
      - name: Install on SQLite
        run: |
          set -e
          kind load docker-image ghcr.io/joshmaster2165/controltower:ci --name ct
          helm install ct-sqlite "$CHART" -f "$CHART/ci/sqlite-values.yaml" --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 4m
          helm test ct-sqlite --logs
          kubectl logs deploy/ct-sqlite-controltower | grep -q 'CI-SETUP-CODE'
          kubectl logs deploy/ct-sqlite-controltower | grep -q 'config loaded'   # the mounted config file was read
          # Port-forwards are tracked by pid: one dies with the pod it points at, and a restart replaces the pod.
          kubectl port-forward svc/ct-sqlite-controltower 4400:4000 >/dev/null 2>&1 & PF=$!; sleep 3
          curl -fsS -X POST localhost:4400/admin/api/setup -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-password-123","setup_code":"CI-SETUP-CODE"}' >/dev/null
          curl -sI localhost:4400/ | grep -qi 'content-security-policy'
          # A new pod on the same volume keeps the data.
          kubectl rollout restart deploy/ct-sqlite-controltower && kubectl rollout status deploy/ct-sqlite-controltower --timeout 3m
          kill $PF 2>/dev/null || true; kubectl port-forward svc/ct-sqlite-controltower 4400:4000 >/dev/null 2>&1 & PF=$!; sleep 3
          curl -fsS localhost:4400/admin/api/status | grep -q '"setup_complete":true'
          curl -fsS -X POST localhost:4400/admin/api/login -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-password-123"}' >/dev/null
          kill $PF 2>/dev/null || true
      - name: Install two pods on Postgres and Redis
        run: |
          set -e
          kubectl create deployment ci-pg --image=postgres:17-alpine && kubectl set env deployment/ci-pg POSTGRES_PASSWORD=ci && kubectl expose deployment ci-pg --port 5432
          kubectl create deployment ci-redis --image=redis:7-alpine && kubectl expose deployment ci-redis --port 6379
          kubectl rollout status deployment/ci-pg --timeout 3m && kubectl rollout status deployment/ci-redis --timeout 3m
          helm install ct-pg "$CHART" -f "$CHART/ci/postgres-values.yaml" --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 5m
          helm test ct-pg --logs
          for p in $(kubectl get pods -l app.kubernetes.io/instance=ct-pg -o name); do kubectl logs "$p" | grep -q 'sharing Postgres and Redis'; done
          test "$(kubectl get pods -l app.kubernetes.io/instance=ct-pg --field-selector=status.phase=Running -o name | wc -l)" = 2
          kubectl port-forward svc/ct-pg-controltower 4401:4000 >/dev/null 2>&1 & PF=$!; sleep 3
          curl -fsS -H 'Authorization: Bearer ci-admin-key-0123456789abcdef' localhost:4401/admin/api/keys >/dev/null
          kill $PF 2>/dev/null || true
      - name: Show what went wrong
        if: failure()
        run: kubectl get all,pvc; kubectl describe pods; for p in $(kubectl get pods -o name); do echo "== $p"; kubectl logs "$p" --all-containers --tail 80; done
      - name: Publish the chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CHART" -d dist-chart
          helm push dist-chart/controltower-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee push.log
          echo "DIGEST=$(grep -o 'sha256:[0-9a-f]*' push.log | head -1)" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v4.1.2
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Sign the chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/controltower@${DIGEST}"

  # npm package: `npx controltower-ai`. Publishes on version tags once an NPM_TOKEN
  # repository secret exists; until then the job builds the package and skips publishing.
  npm:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-npm.mjs
      - name: Publish controltower-ai
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: dist-npm
        run: npm publish --provenance --access public
      - name: Publishing skipped
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::notice::Add an NPM_TOKEN repository secret to publish controltower-ai to npm on the next tag."
