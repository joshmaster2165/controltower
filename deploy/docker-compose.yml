# One-command self-host: docker compose -f deploy/docker-compose.yml up -d
# Then open http://localhost:4000 — the Get started guide takes it from there
# (it can also start a demo fleet if you just want to look around).
services:
  controltower:
    image: ghcr.io/joshmaster2165/controltower:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: controltower
    ports:
      - "4000:4000"
    environment:
      # CT_DEMO: "1"                                  # start with the demo fleet flying
      # CT_PUBLIC_URL: "https://tower.example.com"   # used for signed approval links and the ingress probe
      # CT_MASTER_KEY: ""                              # base64 32 bytes; otherwise generated in /data/master.key
    volumes:
      - controltower-data:/data
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  controltower-data:
