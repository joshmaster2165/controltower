server {
  listen 8080;
  listen [::]:8080;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  # Pages change with each publish; images and assets less often.
  location ~* \.html$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(png|gif|svg|css|js|woff2?)$ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff always; }
  error_page 404 /index.html;
}
