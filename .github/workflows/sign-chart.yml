name: sign-chart

# Sign a Helm chart version that is already published (for one whose release build couldn't sign it).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version, e.g. 0.1.8
        required: true

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/setup-buildx-action@v4
      - name: Sign by digest, then verify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/${{ github.repository_owner }}/charts/controltower"
          DIGEST=$(docker buildx imagetools inspect "$REF:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$DIGEST"
          cosign sign --yes "$REF@$DIGEST"
          cosign verify "$REF@$DIGEST" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/sign-chart.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "::notice::Signed $REF:$VERSION ($DIGEST)"
